name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run kit:check
      - run: npm run test:themes
      - run: node bin/cuekitvoltz.mjs doctor
      - run: npm run build
      - run: npm pack --dry-run

  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile voice/*.py
      - run: python -m unittest discover -s voice/tests
